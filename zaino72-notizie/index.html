<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Zaino 72 ore – Novità via email</title>
<link rel="icon" href="../favicon.png">
<style>
  :root { --bg:#f3f5f4; --card:#fff; --line:#d9dfdc; --text:#16222a; --muted:#5b6770; --accent:#c2410c; --ok:#166534; --bad:#b91c1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1518; --card:#172025; --line:#2a363c; --text:#e7ecea; --muted:#9aa7ad; --accent:#f97316; --ok:#4ade80; --bad:#f87171; } }
  * { box-sizing:border-box }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--text); font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif }
  main { max-width:460px; margin:0 auto; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px }
  .logo { display:inline-block; background:var(--accent); color:#fff; font-weight:800; border-radius:6px; padding:2px 7px; margin-right:6px }
  h1 { font-size:22px; margin:16px 0 8px }
  p { margin:8px 0 }
  label { display:block; font-weight:600; margin:16px 0 6px }
  input[type=email] { width:100%; font:inherit; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--text) }
  .check { display:flex; gap:10px; align-items:flex-start; font-weight:400; margin-top:16px }
  .check input { width:20px; height:20px; margin-top:2px; flex:none }
  .hp { position:absolute; left:-5000px; width:1px; height:1px; overflow:hidden }
  button { margin-top:16px; font:inherit; font-weight:700; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:12px 18px; cursor:pointer; width:100% }
  button:disabled { opacity:.5; cursor:default }
  .msg { margin-top:16px; font-weight:600 } .msg.ok { color:var(--ok) } .msg.bad { color:var(--bad) }
  .muted { color:var(--muted); font-size:14px }
  a { color:var(--accent) }
</style>
</head>
<body>
<main>
  <div><span class="logo">72h</span><b>Zaino 72 ore</b></div>
  <h1 data-k="title"></h1>
  <p data-k="intro"></p>
  <p id="pv" hidden></p>
  <form id="f" novalidate>
    <label for="email" data-k="email"></label>
    <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required>
    <div class="hp" aria-hidden="true"><label for="website">Website</label><input id="website" name="website" tabindex="-1" autocomplete="off"></div>
    <label class="check"><input id="consent" type="checkbox" required><span data-k="consent"></span></label>
    <button id="b" type="submit" data-k="btn"></button>
  </form>
  <button id="act" type="button" hidden></button>
  <p id="m" class="msg" role="status"></p>
  <p class="muted" data-k="note"></p>
</main>
<script>
/* Iscrizione alle novità di Zaino 72 ore, e (con ?a=confirm|unsub&t=…) conferma e cancellazione dai link nelle email. La pagina non salva nulla: invia email e lingua allo script Google
   (Apps Script) del Foglio «Zaino72 iscritti», che manda l'email di conferma. Sorgente e istruzioni nel repo
   privato ZainoEmergenze, cartella newsletter/. */
"use strict";
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwMQPLDFG5xKPKY_NK8G8VBPYX_zqCn5Gjo3yGXPO4hr7RiQpxlhuCT_hrtwJXs20Uq/exec";   // App web Apps Script del Foglio «Zaino72 iscritti»
const PRIVACY = "https://elconfa.github.io/zaino72-privacy/";
const L = {
  it: { preview: "L'app è in anteprima su Google Play: usa l'indirizzo Gmail del tuo account Google Play e ti mando anche l'invito per provarla.",
    cTitle: "Conferma l'iscrizione", cText: "Tocca il pulsante per confermare che vuoi ricevere per email le novità di Zaino 72 ore.", cBtn: "Confermo l'iscrizione",
    cDone: "Iscrizione confermata, grazie! Puoi chiudere questa pagina.", uTitle: "Cancellazione", uText: "Vuoi smettere di ricevere le email di Zaino 72 ore? Il tuo indirizzo verrà cancellato.", uBtn: "Cancellami",
    uDone: "Fatto: il tuo indirizzo è stato cancellato e non riceverai più email.", invalid: "Questo link non è valido o è già stato usato.",
    title: "Novità via email", intro: "Ricevi per email le novità dell'app Zaino 72 ore e, un paio di volte all'anno, un promemoria per controllare kit e scadenze. Poche email, ti cancelli quando vuoi.",
    email: "Il tuo indirizzo email", consent: "Ho letto l'{p} e voglio ricevere le email di Zaino 72 ore.", privacy: "informativa privacy", btn: "Iscrivimi",
    sent: "Fatto! Ti ho mandato un'email: apri il link per confermare l'iscrizione. Se non la trovi, guarda in Spam o Promozioni.",
    badEmail: "Controlla l'indirizzo email.", needConsent: "Spunta la casella per dare il consenso.", busy: "Troppe richieste oggi: riprova domani.", err: "Non riesco a collegarmi. Controlla la connessione e riprova.",
    note: "Il tuo indirizzo lo riceve solo lo sviluppatore, Massimo, e lo usa solo per queste email, inviate una per una: nessun altro lo vede." },
  en: { preview: "The app is in preview on Google Play: use the Gmail address of your Google Play account and I'll also send you an invitation to try it.",
    cTitle: "Confirm your subscription", cText: "Tap the button to confirm that you want to receive Zaino 72 ore news by email.", cBtn: "I confirm",
    cDone: "Subscription confirmed, thank you! You can close this page.", uTitle: "Unsubscribe", uText: "Do you want to stop receiving Zaino 72 ore emails? Your address will be deleted.", uBtn: "Unsubscribe me",
    uDone: "Done: your address has been deleted and you won't receive any more emails.", invalid: "This link is not valid or has already been used.",
    title: "News by email", intro: "Get news about the Zaino 72 ore app by email and, a couple of times a year, a reminder to check your kits and expiry dates. Few emails, unsubscribe any time.",
    email: "Your email address", consent: "I have read the {p} and want to receive Zaino 72 ore emails.", privacy: "privacy policy", btn: "Sign me up",
    sent: "Done! I've sent you an email: open the link to confirm. If you can't find it, check Spam or Promotions.",
    badEmail: "Please check the email address.", needConsent: "Tick the box to give your consent.", busy: "Too many requests today: please try again tomorrow.", err: "Can't connect. Check your connection and try again.",
    note: "Only the developer, Massimo, receives your address and uses it only for these emails, sent one by one: nobody else sees it. Emails are mainly in Italian, with a short English summary." },
  fr: { preview: "L'app est en avant-première sur Google Play : utilisez l'adresse Gmail de votre compte Google Play et je vous enverrai aussi une invitation pour l'essayer.",
    cTitle: "Confirmez votre inscription", cText: "Touchez le bouton pour confirmer que vous voulez recevoir par e-mail les nouveautés de Zaino 72 ore.", cBtn: "Je confirme",
    cDone: "Inscription confirmée, merci ! Vous pouvez fermer cette page.", uTitle: "Désinscription", uText: "Voulez-vous ne plus recevoir les e-mails de Zaino 72 ore ? Votre adresse sera supprimée.", uBtn: "Me désinscrire",
    uDone: "C'est fait : votre adresse a été supprimée et vous ne recevrez plus d'e-mails.", invalid: "Ce lien n'est pas valide ou a déjà été utilisé.",
    title: "Nouveautés par e-mail", intro: "Recevez par e-mail les nouveautés de l'app Zaino 72 ore et, deux fois par an environ, un rappel pour vérifier vos kits et les dates de péremption. Peu d'e-mails, désinscription à tout moment.",
    email: "Votre adresse e-mail", consent: "J'ai lu la {p} et je veux recevoir les e-mails de Zaino 72 ore.", privacy: "politique de confidentialité", btn: "M'inscrire",
    sent: "C'est fait ! Je vous ai envoyé un e-mail : ouvrez le lien pour confirmer. Sinon, regardez dans Spam ou Promotions.",
    badEmail: "Vérifiez l'adresse e-mail.", needConsent: "Cochez la case pour donner votre consentement.", busy: "Trop de demandes aujourd'hui : réessayez demain.", err: "Connexion impossible. Vérifiez votre connexion et réessayez.",
    note: "Seul le développeur, Massimo, reçoit votre adresse et l'utilise uniquement pour ces e-mails, envoyés un par un : personne d'autre ne la voit. Les e-mails sont surtout en italien, avec un court résumé en anglais." },
  de: { preview: "Die App ist als Vorabversion bei Google Play verfügbar: Verwende die Gmail-Adresse deines Google-Play-Kontos, dann schicke ich dir auch eine Einladung zum Testen.",
    cTitle: "Anmeldung bestätigen", cText: "Tippe auf die Schaltfläche, um zu bestätigen, dass du Neuigkeiten zu Zaino 72 ore per E-Mail erhalten möchtest.", cBtn: "Ich bestätige",
    cDone: "Anmeldung bestätigt, danke! Du kannst diese Seite schließen.", uTitle: "Abmelden", uText: "Möchtest du keine E-Mails von Zaino 72 ore mehr erhalten? Deine Adresse wird gelöscht.", uBtn: "Abmelden",
    uDone: "Erledigt: Deine Adresse wurde gelöscht, du erhältst keine E-Mails mehr.", invalid: "Dieser Link ist ungültig oder wurde schon verwendet.",
    title: "Neuigkeiten per E-Mail", intro: "Erhalte Neuigkeiten zur App Zaino 72 ore per E-Mail und ein- bis zweimal im Jahr eine Erinnerung, Sets und Ablaufdaten zu prüfen. Wenige E-Mails, jederzeit abmeldbar.",
    email: "Deine E-Mail-Adresse", consent: "Ich habe die {p} gelesen und möchte E-Mails von Zaino 72 ore erhalten.", privacy: "Datenschutzerklärung", btn: "Anmelden",
    sent: "Geschafft! Ich habe dir eine E-Mail geschickt: Öffne den Link, um die Anmeldung zu bestätigen. Schau sonst im Spam- oder Werbeordner nach.",
    badEmail: "Bitte prüfe die E-Mail-Adresse.", needConsent: "Setze das Häkchen, um zuzustimmen.", busy: "Heute zu viele Anfragen: Bitte morgen erneut versuchen.", err: "Keine Verbindung. Prüfe deine Verbindung und versuche es erneut.",
    note: "Nur der Entwickler, Massimo, erhält deine Adresse und nutzt sie nur für diese E-Mails, die einzeln verschickt werden: Niemand sonst sieht sie. Die E-Mails sind meist auf Italienisch, mit kurzer englischer Zusammenfassung." },
  es: { preview: "La app está en versión preliminar en Google Play: usa la dirección Gmail de tu cuenta de Google Play y te enviaré también una invitación para probarla.",
    cTitle: "Confirma tu suscripción", cText: "Toca el botón para confirmar que quieres recibir por correo las novedades de Zaino 72 ore.", cBtn: "Confirmo",
    cDone: "Suscripción confirmada, ¡gracias! Puedes cerrar esta página.", uTitle: "Darse de baja", uText: "¿Quieres dejar de recibir los correos de Zaino 72 ore? Tu dirección se borrará.", uBtn: "Darme de baja",
    uDone: "Hecho: tu dirección se ha borrado y no recibirás más correos.", invalid: "Este enlace no es válido o ya se ha usado.",
    title: "Novedades por correo", intro: "Recibe por correo las novedades de la app Zaino 72 ore y, un par de veces al año, un recordatorio para revisar tus kits y fechas de caducidad. Pocos correos, te das de baja cuando quieras.",
    email: "Tu dirección de correo", consent: "He leído la {p} y quiero recibir los correos de Zaino 72 ore.", privacy: "política de privacidad", btn: "Suscribirme",
    sent: "¡Hecho! Te he enviado un correo: abre el enlace para confirmar. Si no lo encuentras, mira en Spam o Promociones.",
    badEmail: "Revisa la dirección de correo.", needConsent: "Marca la casilla para dar tu consentimiento.", busy: "Demasiadas solicitudes hoy: inténtalo mañana.", err: "No puedo conectar. Revisa tu conexión e inténtalo de nuevo.",
    note: "Solo el desarrollador, Massimo, recibe tu dirección y la usa solo para estos correos, enviados uno a uno: nadie más la ve. Los correos son sobre todo en italiano, con un breve resumen en inglés." }
};
const q = new URLSearchParams(location.search);
const lang = [q.get("lang"), (navigator.language || "it").slice(0, 2)].find(x => x && L[x]) || "it";
const t = L[lang];
document.documentElement.lang = lang;
document.title = "Zaino 72 ore – " + t.title;
document.querySelectorAll("[data-k]").forEach(el => { const k = el.dataset.k; if (k !== "consent") el.textContent = t[k]; });
const cs = document.querySelector('[data-k="consent"]'), [pre, post] = t.consent.split("{p}"), a = document.createElement("a");
a.href = PRIVACY; a.target = "_blank"; a.rel = "noopener"; a.textContent = t.privacy;
cs.append(pre, a, post);
// Dal sito (?src=sito): chi vuole provare l'app riceve anche l'invito al test chiuso di Google Play
if (q.get("src") === "sito" && !q.get("a")) { const pv = document.getElementById("pv"); pv.textContent = t.preview; pv.hidden = false; }

const f = document.getElementById("f"), b = document.getElementById("b"), m = document.getElementById("m");
const say = (s, ok) => { m.textContent = s; m.className = "msg " + (ok ? "ok" : "bad"); };
// fetch senza cookie (cross-origin): l'account Google del browser non conta. text/plain: niente preflight CORS.
const call = async body => (await fetch(ENDPOINT, { method: "POST", credentials: "omit", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })).json();

// Link dalle email: conferma (?a=confirm) o cancellazione (?a=unsub), sempre con un tocco esplicito
const act = q.get("a"), tok = q.get("t") || "";
if (act === "confirm" || act === "unsub") {
  const c = act === "confirm", ab = document.getElementById("act");
  f.hidden = true; document.querySelector('[data-k="note"]').hidden = true;
  document.querySelector('[data-k="title"]').textContent = c ? t.cTitle : t.uTitle;
  document.querySelector('[data-k="intro"]').textContent = c ? t.cText : t.uText;
  document.title = "Zaino 72 ore – " + (c ? t.cTitle : t.uTitle);
  if (!/^[0-9a-f]{40}$/.test(tok)) { ab.remove(); say(t.invalid); }
  else {
    ab.textContent = c ? t.cBtn : t.uBtn; ab.hidden = false;
    ab.addEventListener("click", async () => {
      ab.disabled = true; say("", true);
      try {
        const d = await call({ a: act, t: tok });
        if (d.ok) { say(c ? t.cDone : t.uDone, true); ab.remove(); }
        else { say(d.err === "invalid" ? t.invalid : t.err); ab.disabled = false; }
      } catch (x) { say(t.err); ab.disabled = false; }
    });
  }
}
f.addEventListener("submit", async e => {
  e.preventDefault();
  const email = f.email.value.trim();
  if (!/^[^\s@,;<>]+@[^\s@,;<>]+\.[a-z]{2,}$/i.test(email)) return say(t.badEmail);
  if (!f.querySelector("#consent").checked) return say(t.needConsent);
  b.disabled = true; say("", true);
  try {
    const d = await call({ a: "subscribe", email, lang, consent: true, website: f.website.value, src: (q.get("src") || "web").slice(0, 20) });
    if (d.ok) { say(t.sent, true); f.hidden = true; }
    else { say(d.err === "email" ? t.badEmail : d.err === "busy" ? t.busy : t.err); b.disabled = false; }
  } catch (x) { say(t.err); b.disabled = false; }
});
</script>
</body>
</html>
